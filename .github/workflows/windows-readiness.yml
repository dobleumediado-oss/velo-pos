name: Validación Windows de VELO Desktop

on:
  push:
    branches:
      - 'codex/desktop-parity-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar dependencias nativas para Electron
        run: npm run rebuild
      - name: Validar release
        run: npm run test:tech-readiness
      - name: Batería completa
        run: npm test
