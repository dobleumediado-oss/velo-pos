name: Release Velo POS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # npm ci instala better-sqlite3 para el ABI de Node del runner. Las pruebas
      # y la aplicación usan el ABI de Electron, por lo que debe reconstruirse
      # antes de ejecutar cualquier flujo que abra la base de datos.
      - name: Preparar dependencias nativas para Electron
        run: npm run rebuild

      - name: Pruebas y validaciones
        run: npm run test:tech-readiness

      # Pre-crear el release ANTES de compilar evita la race conocida: si no
      # existe, cada invocación de electron-builder (Terminal, TECH y servidores) crea su
      # propio release para el mismo tag → assets partidos en dos (o 422
      # already_exists). Pre-creándolo, las cuatro ediciones suben al MISMO release.
      # Se publica en velo-pos-releases, el repositorio público de descargas.
      # Si el token no tiene permiso allí, el paso falla antes de compilar.
      - name: Pre-crear release en velo-pos-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo dobleumediado-oss/velo-pos-releases >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo dobleumediado-oss/velo-pos-releases \
                 --target main --title "${{ github.ref_name }}" --notes "Velo POS ${{ github.ref_name }}"

      - name: Compilar y publicar Terminal Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:terminal

      - name: Compilar y publicar VELO TECH POS Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:tech

      - name: Compilar y publicar Servidor Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:server

      - name: Compilar y publicar VELO TECH POS Server Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:tech-server

      # Transición: los programas anteriores a 1.59.2 todavía buscan
      # actualizaciones en velo-pos. Se copia ahí el mismo release, con los
      # instaladores antes que los .yml para que ningún cliente vea un canal que
      # apunte a un instalador aún no subido. Quitar este paso cuando todos los
      # clientes hayan pasado por 1.59.2 y velo-pos vaya a hacerse privado.
      - name: Copiar el release a velo-pos (clientes anteriores a 1.59.2)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          mkdir -p espejo
          gh release download "$tag" --repo dobleumediado-oss/velo-pos-releases --dir espejo --clobber
          ls espejo/*.exe espejo/*.yml >/dev/null
          if gh release view "$tag" --repo dobleumediado-oss/velo-pos >/dev/null 2>&1; then
            gh release upload "$tag" espejo/*.exe espejo/*.blockmap --repo dobleumediado-oss/velo-pos --clobber
            gh release upload "$tag" espejo/*.yml --repo dobleumediado-oss/velo-pos --clobber
          else
            gh release create "$tag" espejo/*.exe espejo/*.blockmap espejo/*.yml --repo dobleumediado-oss/velo-pos \
              --verify-tag --title "$tag" --notes "Velo POS $tag"
          fi
