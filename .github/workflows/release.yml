name: Release Velo POS

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas y validaciones
        run: npm run release:check

      # Pre-crear el release ANTES de compilar evita la race conocida: si no
      # existe, cada invocación de electron-builder (Terminal y Server) crea su
      # propio release para el mismo tag → assets partidos en dos (o 422
      # already_exists). Pre-creándolo, ambas ediciones suben al MISMO release.
      - name: Pre-crear release (evita release partido / 422)
        shell: bash   # en pwsh (Windows) el `|| echo` no resetea el exit code y el paso falla
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Velo POS ${{ github.ref_name }}" --verify-tag || echo "El release ya existe, continuo"

      - name: Compilar y publicar Terminal Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:terminal

      - name: Compilar y publicar Servidor Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:win:server
